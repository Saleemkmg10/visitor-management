<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Visitor Management System</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <div class="header">

        <div class="header-icon">
            👤
        </div>

        <h1>Visitor Management System</h1>

        <p class="subtitle">
            Simple, secure and efficient visitor check-in
        </p>

    </div>


    <!-- ========================= -->
    <!-- VISITOR CHECK-IN -->
    <!-- ========================= -->

    <div class="card">

        <h2>Visitor Check-In</h2>

        <label for="phone">
            Phone Number
        </label>

        <input
                type="text"
                id="phone"
                placeholder="Enter phone number"
                autocomplete="off"
        >

        <button id="checkVisitorButton">
            Continue
        </button>

    </div>


    <!-- ========================= -->
    <!-- NEW VISITOR REGISTRATION -->
    <!-- ========================= -->

    <div id="newVisitorSection"
         class="card hidden">

        <h2>New Visitor Registration</h2>


        <label for="name">
            Name
        </label>

        <input
                type="text"
                id="name"
                placeholder="Enter full name"
        >


        <label for="newPhone">
            Mobile Number
        </label>

        <input
                type="text"
                id="newPhone"
                readonly
        >


        <label for="email">
            Gmail
        </label>

        <input
                type="email"
                id="email"
                placeholder="Enter Gmail address"
        >


        <label for="host">
            Whom do you want to meet?
        </label>

        <select id="host">

            <option value="">
                Select Host
            </option>

        </select>


        <label for="purpose">
            Purpose of Visit
        </label>

        <input
                type="text"
                id="purpose"
                placeholder="Enter purpose of visit"
        >


        <button id="registerVisitorButton">
            Register Visitor
        </button>

    </div>


    <!-- ========================= -->
    <!-- EXISTING VISITOR -->
    <!-- ========================= -->

    <div id="existingVisitorSection"
         class="card hidden">

        <h2>Existing Visitor</h2>


        <div id="visitorDetails">

            <!-- Visitor details will be displayed here -->

        </div>


        <label for="existingHost">
            Whom do you want to meet?
        </label>

        <select id="existingHost">

            <option value="">
                Select Host
            </option>

        </select>


        <label for="existingPurpose">
            Purpose of Visit
        </label>

        <input
                type="text"
                id="existingPurpose"
                placeholder="Enter purpose of visit"
        >


        <button id="createVisitButton">
            Start Visit
        </button>

    </div>


    <!-- ========================= -->
    <!-- VISIT STATUS -->
    <!-- ========================= -->

    <div id="visitSection"
         class="card hidden">

        <h2>Visit Status</h2>


        <p id="visitStatus">
            Status: WAITING
        </p>


        <div class="visit-actions">

            <button id="startMeetingButton">
                Start Meeting
            </button>


            <button id="completeMeetingButton">
                Complete Meeting
            </button>


            <button id="exitButton">
                Visitor Exit
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- HOST NOTIFICATIONS -->
    <!-- ========================= -->

    <div class="card">

        <h2>Host Notifications</h2>


        <div id="notifications">

            No notifications yet.

        </div>

    </div>


</div>


<!-- ========================= -->
<!-- STOMP WEBSOCKET LIBRARY -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js">
</script>


<!-- ========================= -->
<!-- APPLICATION JAVASCRIPT -->
<!-- ========================= -->

<script src="script.js"></script>


</body>

</html>
